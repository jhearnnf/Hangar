<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c202a"/>
      <stop offset="1" stop-color="#0e1015"/>
    </linearGradient>
    <!-- The threshold reads as one solid bar rather than four dots: at 16px a
         row of gapped dots turns into colour noise. -->
    <clipPath id="threshold">
      <rect x="216" y="792" width="592" height="48" rx="24"/>
    </clipPath>
  </defs>

  <!-- app tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="4" y="4" width="1016" height="1016" rx="220" fill="none"
        stroke="#ffffff" stroke-opacity="0.07" stroke-width="8"/>

  <g transform="translate(0,-16)">
    <!-- hangar shell, an open-bottomed arch -->
    <path d="M 216 792 L 216 512 A 296 296 0 0 1 808 512 L 808 792"
          fill="none" stroke="#4a5568" stroke-width="40" stroke-linecap="square"/>

    <!-- the prompt: the mark that has to survive at 16px, so it carries the
         contrast and everything else stays behind it -->
    <g fill="none" stroke-width="76" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 364 462 L 492 578 L 364 694" stroke="#4d9cf6"/>
      <path d="M 566 694 L 660 694" stroke="#e6edf3"/>
    </g>

    <!-- threshold: the four stage colours -->
    <g clip-path="url(#threshold)">
      <rect x="216" y="792" width="148" height="48" fill="#f4675f"/>
      <rect x="364" y="792" width="148" height="48" fill="#e8913a"/>
      <rect x="512" y="792" width="148" height="48" fill="#d8c342"/>
      <rect x="660" y="792" width="148" height="48" fill="#4fb45c"/>
    </g>
  </g>
</svg>
